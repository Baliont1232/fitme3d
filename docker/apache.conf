# =====================================================================
# apache.conf – az Apache webszerver beállítása a Docker képben
# =====================================================================

# minden porton fogad kérést (a portot a start.sh állítja a Railway PORT változójára)
<VirtualHost *:*>
    # a weboldal gyökere: itt van a lefordított React oldal
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # a .htaccess fájlok használata engedélyezve (az /api mappában van egy)
        AllowOverride All
        # mindenki elérheti az oldalt
        Require all granted
        # URL-átírás bekapcsolása
        RewriteEngine On
        # ha a kérés NEM az API-nak szól...
        RewriteCond %{REQUEST_URI} !^/api/
        # ...és nem létező fájl...
        RewriteCond %{REQUEST_FILENAME} !-f
        # ...és nem létező mappa...
        RewriteCond %{REQUEST_FILENAME} !-d
        # ...akkor az index.html-t kapja (a React router dönti el, melyik oldal jelenik meg)
        RewriteRule ^ /index.html [L]
    </Directory>

    # az SQL fájlok kívülről nem tölthetők le
    <Directory /var/www/html/api/database>
        # minden hozzáférés tiltva
        Require all denied
    </Directory>

    # a hibák a konténer naplójába kerülnek (a Railway felületén látszanak)
    ErrorLog /proc/self/fd/2
    # a hozzáférési napló is
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
